[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terstars"
version = "0.1.0"
description = "Telegram Stars seller bot with safe test payment flow"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.10,<4",
    "aiohttp>=3.9,<4",
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.3,<3",
    "qrcode>=7.4,<9",
    "sqlalchemy>=2.0,<3",
    "telethon>=1.36,<2",
    "fragment-stars-api>=2.1.3,<2.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "scripts*", "sessions*", "tests*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
